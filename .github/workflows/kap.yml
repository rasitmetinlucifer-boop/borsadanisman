name: KAP Haberlerini Guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  kap:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: KAP verisini cek
        run: |
          node <<'EOF'
          const fs = require("fs");

          async function main() {
            const url =
              "https://www.kap.org.tr/tr/bildirim-sorgu-sonuc?cat=6&cmp=&s=ALL&srcbar=Y";

            try {
              const response = await fetch(url, {
                headers: {
                  "User-Agent":
                    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                  "Accept":
                    "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language":
                    "tr-TR,tr;q=0.9,en;q=0.8"
                }
              });

              if (!response.ok) {
                throw new Error("KAP HTTP " + response.status);
              }

              const html = await response.text();

              const links = [
                ...html.matchAll(
                  /href=["']([^"']*\/tr\/Bildirim\/(\d+)[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi
                )
              ];

              const temizle = (s) =>
                s
                  .replace(/<[^>]+>/g, " ")
                  .replace(/&nbsp;/g, " ")
                  .replace(/&amp;/g, "&")
                  .replace(/\s+/g, " ")
                  .trim();

              const items = [];
              const seen = new Set();

              for (const m of links) {
                const id = m[2];

                if (seen.has(id)) continue;
                seen.add(id);

                const title = temizle(m[3]);
                if (!title) continue;

                const href = m[1].startsWith("http")
                  ? m[1]
                  : "https://www.kap.org.tr" + m[1];

                items.push({
                  id,
                  title,
                  url: href
                });

                if (items.length >= 50) break;
              }

              fs.writeFileSync(
                "kap-haberleri.json",
                JSON.stringify(
                  {
                    ok: true,
                    source: "KAP",
                    updatedAt: new Date().toISOString(),
                    items
                  },
                  null,
                  2
                )
              );

              console.log("Bulunan KAP bildirimi:", items.length);
            } catch (error) {
              console.error(error);
              process.exit(1);
            }
          }

          main();
          EOF

      - name: JSON dosyasini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kap-haberleri.json

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi

          git commit -m "KAP haberlerini guncelle"
          git push
